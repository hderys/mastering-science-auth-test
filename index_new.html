<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mastering Science - 登入</title>

    <script src="https://cdn.jsdelivr.net/npm/firebase@12.15.0/firebase-app-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@12.15.0/firebase-auth-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@12.15.0/firebase-firestore-compat.js">
    </script>

    <style>
        /* ===== 全域 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            transition: background 0.6s ease;
        }

        /* ===== 背景粒子（index_new） ===== */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* ===== 左上角標題（保留 index.html 位置） ===== */
        .header-top-left {
            position: fixed;
            top: 24px;
            left: 28px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-top-left .logo {
            font-size: 32px;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        .header-top-left h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .header-top-left .sub {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            margin-left: 2px;
        }

        /* ===== 登入框（白色風格，取自 index.html） ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 28px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease-out;
            max-height: 98vh;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 登入框內的標題（只顯示在框內，手機相容） ===== */
        .mobile-header {
            display: none;
            text-align: center;
            margin-bottom: 16px;
        }

        .mobile-header .logo {
            font-size: 28px;
        }

        .mobile-header h2 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===== 狀態列 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f5f0ff;
            border-radius: 12px;
            padding: 6px 14px;
            margin-bottom: 16px;
            border: 1px solid #e9e4f5;
        }

        .status-bar .user-display {
            color: #4a1d8c;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-badge {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
        }

        .status-badge.online {
            background: #d4edda;
            color: #065f46;
        }

        .status-badge.offline {
            background: #f8d7da;
            color: #7f1d1d;
        }

        /* ===== 表單（白色風格） ===== */
        .form-title {
            color: #2e0f5a;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #4a1d8c;
            margin-bottom: 3px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #faf8ff;
            border: 2px solid #e0d6f5;
            border-radius: 12px;
            color: #1a1a2e;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: #b0a8c8;
        }

        .form-group input:focus {
            border-color: #4a1d8c;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(74, 29, 140, 0.08);
        }

        /* ===== 班級選擇（白色風格） ===== */
        .class-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 2px;
        }

        .class-option {
            padding: 10px 8px;
            border-radius: 12px;
            border: 2px solid #e0d6f5;
            background: #faf8ff;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            color: #888;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .class-option:hover {
            background: #f5f0ff;
            border-color: #b8a8d8;
        }

        .class-option.active-vip {
            border-color: #fbbf24;
            background: #fef9e7;
            color: #b45309;
        }

        .class-option.active-aoghss {
            border-color: #60a5fa;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .class-option .emoji {
            font-size: 1.2rem;
            display: block;
        }

        .class-option .sub {
            font-size: 0.5rem;
            font-weight: 400;
            opacity: 0.6;
            display: block;
        }

        /* ===== 學號輸入 ===== */
        .student-id-group {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 0;
            margin: 0;
        }

        .student-id-group.show {
            max-height: 80px;
            opacity: 1;
            margin-bottom: 12px;
        }

        .student-id-group input {
            background: #faf8ff !important;
            border-color: #93c5fd !important;
        }

        .student-id-group input:focus {
            border-color: #3b82f6 !important;
        }

        /* ===== 按鈕（白色風格） ===== */
        .btn {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #4a1d8c;
            color: white;
        }

        .btn-primary:hover {
            background: #3b1a6e;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(74, 29, 140, 0.3);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-outline {
            background: #f5f0ff;
            color: #4a1d8c;
            border: 1px solid #e0d6f5;
        }

        .btn-outline:hover {
            background: #ede9fe;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-group .btn {
            flex: 1;
        }

        /* ===== 切換區 ===== */
        .toggle-area {
            text-align: center;
            margin-top: 12px;
        }

        .toggle-area button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.8rem;
            transition: color 0.3s;
            font-family: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .toggle-area button:hover {
            color: #4a1d8c;
        }

        .forgot-link {
            background: none;
            border: none;
            color: #b0a8c8;
            cursor: pointer;
            font-size: 0.7rem;
            margin-top: 4px;
            transition: color 0.3s;
            font-family: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .forgot-link:hover {
            color: #4a1d8c;
        }

        /* ===== 訊息 ===== */
        .message {
            margin-top: 10px;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #7f1d1d;
            border: 1px solid #dc2626;
        }

        .message.info {
            display: block;
            background: #fef3c7;
            color: #7c5a00;
            border: 1px solid #fbbf24;
        }

        /* ===== 使用者資訊 ===== */
        .user-info {
            background: #f9f7ff;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 4px;
            border: 1px solid #e9e4f5;
        }

        .user-info p {
            color: #2e0f5a;
            font-size: 0.85rem;
            margin: 4px 0;
        }

        .user-info .label {
            color: #888;
            font-weight: 300;
        }

        .hidden {
            display: none !important;
        }

        .footer-note {
            margin-top: 12px;
            text-align: center;
            font-size: 0.6rem;
            color: #c4b5d4;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 640px) {
            .header-top-left {
                display: none;
            }

            .mobile-header {
                display: block;
            }

            .container {
                padding: 24px 18px 20px;
                border-radius: 20px;
                max-width: 100%;
            }

            .class-selector {
                gap: 6px;
            }

            .class-option {
                padding: 8px 6px;
                font-size: 0.75rem;
            }
        }

        @media (min-width: 641px) {
            .mobile-header {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 背景粒子 ===== -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- ===== 左上角標題（🧪 保留原本位置） ===== -->
    <div class="header-top-left">
        <span class="logo">🧪</span>
        <div>
            <h1>Mastering Science</h1>
            <div class="sub">一步步掌握科學概念</div>
        </div>
    </div>

    <!-- ===== 登入框（白色風格） ===== -->
    <div class="container">

        <!-- 手機版標題（只在小螢幕顯示） -->
        <div class="mobile-header">
            <span class="logo">🧪</span>
            <h2>Mastering Science</h2>
        </div>

        <!-- 狀態列 -->
        <div class="status-bar">
            <span class="user-display" id="userDisplay">🔓 未登入</span>
            <span class="status-badge offline" id="statusBadge">離線</span>
        </div>

        <!-- ===== 登入 ===== -->
        <div id="loginForm">
            <div class="form-title">🔑 登入</div>

            <div class="form-group">
                <label>電子郵件</label>
                <input type="email" id="loginEmail" placeholder="請輸入 Email" />
            </div>

            <div class="form-group">
                <label>密碼</label>
                <input type="password" id="loginPassword" placeholder="請輸入密碼" />
            </div>

            <button class="btn btn-success" id="loginBtn">🚀 登入</button>

            <div style="text-align:center; margin-top:6px;">
                <button class="forgot-link" id="forgotPasswordBtn">🔐 忘記密碼？</button>
            </div>

            <div class="toggle-area">
                <span style="color:#b0a8c8;">還沒有帳戶？</span>
                <button id="showRegisterBtn">立即註冊</button>
            </div>
        </div>

        <!-- ===== 註冊 ===== -->
        <div id="registerForm" class="hidden">
            <div class="form-title">📝 註冊</div>

            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="regName" placeholder="請輸入你的姓名" />
            </div>

            <div class="form-group">
                <label>電子郵件</label>
                <input type="email" id="regEmail" placeholder="請輸入 Email" />
            </div>

            <div class="form-group">
                <label>密碼（至少 6 碼）</label>
                <input type="password" id="regPassword" placeholder="請輸入密碼" />
            </div>

            <!-- 班級選擇 -->
            <div class="form-group">
                <label>選擇班級</label>
                <div class="class-selector">
                    <div class="class-option" data-class="VIP" onclick="selectClass('VIP')">
                        <span class="emoji">👑</span>
                        VIP
                        <span class="sub">自動產生學號</span>
                    </div>
                    <div class="class-option" data-class="AOGHSS" onclick="selectClass('AOGHSS')">
                        <span class="emoji">🏫</span>
                        AOGHSS
                        <span class="sub">需輸入學號</span>
                    </div>
                </div>
                <input type="hidden" id="selectedClass" value="" />
            </div>

            <!-- 學號輸入 -->
            <div class="student-id-group" id="studentIdGroup">
                <div class="form-group">
                    <label>學號</label>
                    <input type="text" id="regStudentId" placeholder="請輸入你的學號" />
                </div>
            </div>

            <button class="btn btn-primary" id="registerBtn">✅ 註冊</button>

            <div class="toggle-area">
                <span style="color:#b0a8c8;">已有帳戶？</span>
                <button id="showLoginBtn">返回登入</button>
            </div>
        </div>

        <!-- ===== 使用者資訊 ===== -->
        <div id="userInfo" class="hidden">
            <div class="form-title">👤 我的資料</div>
            <div class="user-info" id="userInfoContent"></div>

            <div class="btn-group">
                <button class="btn btn-outline" id="logoutBtn">🚪 登出</button>
                <button class="btn btn-danger" id="deleteAccountBtn">🗑️ 刪除</button>
            </div>
        </div>

        <!-- ===== 訊息 ===== -->
        <div id="message" class="message"></div>

        <div class="footer-note">🔒 安全連線 · Firebase 加密</div>
    </div>

    <script>
        // ============================================================
        // 🎨 背景粒子
        // ============================================================
        function createParticles() {
            const container = document.getElementById('bgParticles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 20 + 15) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // ============================================================
        // 🔥 Firebase
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBWUr-qFjDuAbRn2ueCOA24Bx5vHhGwCzs",
            authDomain: "mastering-science.firebaseapp.com",
            projectId: "mastering-science",
            storageBucket: "mastering-science.firebasestorage.app",
            messagingSenderId: "969510026630",
            appId: "1:969510026630:web:5c0ff3ffc7b3bdc04c8007"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // 📌 DOM
        // ============================================================
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const userInfo = document.getElementById('userInfo');

        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');

        const regName = document.getElementById('regName');
        const regEmail = document.getElementById('regEmail');
        const regPassword = document.getElementById('regPassword');
        const regStudentId = document.getElementById('regStudentId');
        const selectedClass = document.getElementById('selectedClass');
        const studentIdGroup = document.getElementById('studentIdGroup');

        const userDisplay = document.getElementById('userDisplay');
        const statusBadge = document.getElementById('statusBadge');
        const userInfoContent = document.getElementById('userInfoContent');
        const messageEl = document.getElementById('message');

        // ============================================================
        // 🎯 班級選擇
        // ============================================================
        let currentClass = '';

        function selectClass(cls) {
            currentClass = cls;
            selectedClass.value = cls;

            document.querySelectorAll('.class-option').forEach(el => {
                el.classList.remove('active-vip', 'active-aoghss');
                if (el.dataset.class === cls) {
                    el.classList.add(cls === 'VIP' ? 'active-vip' : 'active-aoghss');
                }
            });

            if (cls === 'AOGHSS') {
                studentIdGroup.classList.add('show');
            } else {
                studentIdGroup.classList.remove('show');
                regStudentId.value = '';
            }
        }

        // ============================================================
        // 📨 訊息
        // ============================================================
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function hideMessage() {
            messageEl.className = 'message';
            messageEl.textContent = '';
        }

        // ============================================================
        // 👤 UI 更新
        // ============================================================
        function updateUI(user) {
            if (user) {
                userDisplay.textContent = '✅ ' + user.email;
                statusBadge.textContent = '已登入';
                statusBadge.className = 'status-badge online';
                loginForm.classList.add('hidden');
                registerForm.classList.add('hidden');
                userInfo.classList.remove('hidden');
            } else {
                userDisplay.textContent = '🔓 未登入';
                statusBadge.textContent = '離線';
                statusBadge.className = 'status-badge offline';
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        }

        // ============================================================
        // 🔐 監聽登入狀態
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            updateUI(user);
            if (user) {
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        userInfoContent.innerHTML = `
                            <p><span class="label">👤 姓名：</span>${data.name || '未設定'}</p>
                            <p><span class="label">📧 Email：</span>${user.email}</p>
                            <p><span class="label">📚 班級：</span>${data.className || '未設定'}</p>
                            <p><span class="label">🆔 學號：</span>${data.studentId || '未設定'}</p>
                            <p><span class="label">📅 註冊時間：</span>${data.createdAt ? new Date(data.createdAt).toLocaleString('zh-HK') : '未知'}</p>
                        `;
                    } else {
                        userInfoContent.innerHTML = `<p style="color:#fbbf24;">⚠️ 找不到用戶資料</p>`;
                    }
                } catch (e) {
                    userInfoContent.innerHTML = `<p style="color:#f87171;">❌ 讀取失敗</p>`;
                }
            }
        });

        // ============================================================
        // 📝 註冊
        // ============================================================
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const name = regName.value.trim();
            const email = regEmail.value.trim();
            const password = regPassword.value;
            const studentId = regStudentId.value.trim();
            const className = selectedClass.value;

            if (!name) { showMessage('請輸入姓名', 'error'); return; }
            if (!email) { showMessage('請輸入 Email', 'error'); return; }
            if (password.length < 6) { showMessage('密碼至少 6 碼', 'error'); return; }
            if (!className) { showMessage('請選擇班級', 'error'); return; }
            if (className === 'AOGHSS' && !studentId) { showMessage('請輸入學號', 'error'); return; }

            hideMessage();

            try {
                showMessage('⏳ 建立帳戶中...', 'info');

                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                let finalStudentId = studentId;
                if (className === 'VIP') {
                    finalStudentId = 'VIP' + Date.now().toString().slice(-6);
                }

                await db.collection('users').doc(user.uid).set({
                    userId: user.uid,
                    name: name,
                    className: className,
                    studentId: finalStudentId,
                    email: email,
                    isTeacher: false,
                    createdAt: new Date().toISOString(),
                    latestStatus: {},
                    allAttempts: [],
                    favorites: [],
                    practiceHistory: [],
                    achievements: {},
                    stats: { totalQuestionsAnswered: 0, totalCorrect: 0 },
                    translationStats: { totalAttempted: 0, totalCorrect: 0, consecutiveCorrect: 0,
                        maxConsecutive: 0, perfectRuns: 0, lastAttemptTime: 0, quickCorrectCount: 0 },
                    mistakeTracker: {},
                    chapterAccuracy: {}
                });

                showMessage('🎉 註冊成功！歡迎 ' + name + '！', 'success');
                regName.value = '';
                regEmail.value = '';
                regPassword.value = '';
                regStudentId.value = '';
                document.querySelectorAll('.class-option').forEach(el => el.classList.remove('active-vip',
                    'active-aoghss'));
                studentIdGroup.classList.remove('show');

            } catch (e) {
                console.error('註冊失敗:', e);
                if (e.code === 'auth/email-already-in-use') {
                    showMessage('❌ 此 Email 已被註冊，請直接登入', 'error');
                } else {
                    showMessage('❌ 註冊失敗：' + e.message, 'error');
                }
            }
        });

        // ============================================================
        // 🔑 登入
        // ============================================================
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            if (!email) { showMessage('請輸入 Email', 'error'); return; }
            if (!password) { showMessage('請輸入密碼', 'error'); return; }

            hideMessage();

            try {
                await auth.signInWithEmailAndPassword(email, password);
                showMessage('✅ 登入成功！', 'success');
                loginEmail.value = '';
                loginPassword.value = '';
            } catch (e) {
                console.error('登入失敗:', e);
                if (e.code === 'auth/user-not-found') {
                    showMessage('❌ 找不到此帳戶，請先註冊', 'error');
                } else if (e.code === 'auth/wrong-password') {
                    showMessage('❌ 密碼錯誤，請重試', 'error');
                } else if (e.code === 'auth/too-many-requests') {
                    showMessage('⚠️ 嘗試過多，請稍後再試', 'error');
                } else {
                    showMessage('❌ 登入失敗：' + e.message, 'error');
                }
            }
        });

        // ============================================================
        // 🔐 忘記密碼
        // ============================================================
        document.getElementById('forgotPasswordBtn').addEventListener('click', async () => {
            const email = prompt('請輸入您的 Email 以重設密碼：');
            if (!email) return;

            hideMessage();

            try {
                await auth.sendPasswordResetEmail(email);
                showMessage('✅ 重設密碼郵件已發送到 ' + email + '，請檢查信箱（含垃圾郵件）', 'success');
            } catch (e) {
                console.error('發送失敗:', e);
                if (e.code === 'auth/user-not-found') {
                    showMessage('❌ 找不到此 Email 的帳戶', 'error');
                } else {
                    showMessage('❌ 發送失敗：' + e.message, 'error');
                }
            }
        });

        // ============================================================
        // 🔄 切換
        // ============================================================
        document.getElementById('showRegisterBtn').addEventListener('click', () => {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            hideMessage();
        });

        document.getElementById('showLoginBtn').addEventListener('click', () => {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            hideMessage();
        });

        // ============================================================
        // 🚪 登出
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await auth.signOut();
                showMessage('✅ 已登出', 'success');
            } catch (e) {
                showMessage('❌ 登出失敗：' + e.message, 'error');
            }
        });

        // ============================================================
        // 🗑️ 刪除帳戶
        // ============================================================
        document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) { showMessage('請先登入', 'error'); return; }

            if (!confirm('⚠️ 確定要刪除您的帳戶嗎？此操作無法復原！')) return;

            try {
                const email = user.email;
                const password = prompt('請輸入您的密碼以確認身份：');
                if (!password) { showMessage('需要輸入密碼才能刪除', 'error'); return; }

                const credential = firebase.auth.EmailAuthProvider.credential(email, password);
                await user.reauthenticateWithCredential(credential);

                await db.collection('users').doc(user.uid).delete();
                await user.delete();

                showMessage('✅ 帳戶已成功刪除', 'success');
            } catch (e) {
                console.error('刪除失敗:', e);
                if (e.code === 'auth/wrong-password') {
                    showMessage('❌ 密碼錯誤，請重試', 'error');
                } else if (e.code === 'auth/requires-recent-login') {
                    showMessage('⚠️ 請登出後重新登入再試', 'error');
                } else {
                    showMessage('❌ 刪除失敗：' + e.message, 'error');
                }
            }
        });

        // ============================================================
        // ⌨️ Enter
        // ============================================================
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    if (input.closest('#loginForm')) {
                        document.getElementById('loginBtn').click();
                    } else if (input.closest('#registerForm')) {
                        document.getElementById('registerBtn').click();
                    }
                }
            });
        });

        console.log('✅ 混合版登入頁面已載入！');
        console.log('🎨 背景 = 炫酷星空 ｜ 登入框 = 白色乾淨風格');
        console.log('📍 🧪 標題在左上角（保留原位置）');
    </script>
</body>
</html>
