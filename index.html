<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互動原子模型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-size: 24px; margin-bottom: 10px; color: #e94560; }
  .info {
    background: #16213e;
    padding: 15px 25px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
    min-width: 280px;
  }
  .info .element { font-size: 32px; font-weight: bold; color: #e94560; }
  .info .detail { font-size: 16px; margin-top: 5px; color: #aaa; }
  #stage {
    position: relative;
    width: 500px;
    height: 500px;
    margin: 20px 0;
  }
  .shell {
    position: absolute;
    border: 2px dashed #444;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .shell-label {
    position: absolute;
    font-size: 12px;
    color: #666;
    background: #1a1a2e;
    padding: 0 4px;
  }
  #nucleus {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, #e94560, #8b1a2b);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    z-index: 10;
    box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
  }
  .electron {
    position: absolute;
    width: 18px;
    height: 18px;
    background: #4fc3f7;
    border-radius: 50%;
    cursor: grab;
    z-index: 20;
    box-shadow: 0 0 8px rgba(79, 195, 247, 0.8);
    transition: box-shadow 0.2s;
  }
  .electron:hover { box-shadow: 0 0 15px rgba(79, 195, 247, 1); }
  .electron:active { cursor: grabbing; }
  #electron-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    min-height: 30px;
    margin: 15px 0;
    padding: 10px;
    background: #16213e;
    border-radius: 10px;
    min-width: 280px;
  }
  .pool-electron {
    width: 18px;
    height: 18px;
    background: #4fc3f7;
    border-radius: 50%;
    cursor: grab;
    box-shadow: 0 0 8px rgba(79, 195, 247, 0.8);
  }
  button {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
    transition: background 0.2s;
  }
  #random-btn { background: #e94560; color: white; }
  #random-btn:hover { background: #c73650; }
  #check-btn { background: #4fc3f7; color: #1a1a2e; font-weight: bold; }
  #check-btn:hover { background: #3ab0e0; }
  #reset-btn { background: #555; color: white; }
  #reset-btn:hover { background: #444; }
  #feedback {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    min-height: 28px;
    text-align: center;
  }
  .correct { color: #4caf50; }
  .wrong { color: #f44336; }
  .partial { color: #ff9800; }
</style>
</head>
<body>

<h1>⚛️ 互動原子模型</h1>

<div class="info">
  <div class="element" id="element-name">按「隨機抽出元素」開始</div>
  <div class="detail" id="element-detail"></div>
</div>

<div id="stage">
  <div id="nucleus">原子核</div>
</div>

<div id="electron-pool"></div>

<div>
  <button id="random-btn" onclick="randomElement()">🎲 隨機抽出元素</button>
  <button id="reset-btn" onclick="resetElectrons()">🔄 重置電子</button>
  <button id="check-btn" onclick="checkAnswer()">✅ 檢查答案</button>
</div>

<div id="feedback"></div>

<script>
// 元素數據：H 至 Kr（原子序 1 至 36）
// shells: 每層電子數
const elements = [
  {z:1,  sym:'H',  name:'氫',   shells:[1]},
  {z:2,  sym:'He', name:'氦',   shells:[2]},
  {z:3,  sym:'Li', name:'鋰',   shells:[2,1]},
  {z:4,  sym:'Be', name:'鈹',   shells:[2,2]},
  {z:5,  sym:'B',  name:'硼',   shells:[2,3]},
  {z:6,  sym:'C',  name:'碳',   shells:[2,4]},
  {z:7,  sym:'N',  name:'氮',   shells:[2,5]},
  {z:8,  sym:'O',  name:'氧',   shells:[2,6]},
  {z:9,  sym:'F',  name:'氟',   shells:[2,7]},
  {z:10, sym:'Ne', name:'氖',   shells:[2,8]},
  {z:11, sym:'Na', name:'鈉',   shells:[2,8,1]},
  {z:12, sym:'Mg', name:'鎂',   shells:[2,8,2]},
  {z:13, sym:'Al', name:'鋁',   shells:[2,8,3]},
  {z:14, sym:'Si', name:'矽',   shells:[2,8,4]},
  {z:15, sym:'P',  name:'磷',   shells:[2,8,5]},
  {z:16, sym:'S',  name:'硫',   shells:[2,8,6]},
  {z:17, sym:'Cl', name:'氯',   shells:[2,8,7]},
  {z:18, sym:'Ar', name:'氬',   shells:[2,8,8]},
  {z:19, sym:'K',  name:'鉀',   shells:[2,8,8,1]},
  {z:20, sym:'Ca', name:'鈣',   shells:[2,8,8,2]},
  {z:21, sym:'Sc', name:'鈧',   shells:[2,8,9,2]},
  {z:22, sym:'Ti', name:'鈦',   shells:[2,8,10,2]},
  {z:23, sym:'V',  name:'釩',   shells:[2,8,11,2]},
  {z:24, sym:'Cr', name:'鉻',   shells:[2,8,13,1]},
  {z:25, sym:'Mn', name:'錳',   shells:[2,8,13,2]},
  {z:26, sym:'Fe', name:'鐵',   shells:[2,8,14,2]},
  {z:27, sym:'Co', name:'鈷',   shells:[2,8,15,2]},
  {z:28, sym:'Ni', name:'鎳',   shells:[2,8,16,2]},
  {z:29, sym:'Cu', name:'銅',   shells:[2,8,18,1]},
  {z:30, sym:'Zn', name:'鋅',   shells:[2,8,18,2]},
  {z:31, sym:'Ga', name:'鎵',   shells:[2,8,18,3]},
  {z:32, sym:'Ge', name:'鍺',   shells:[2,8,18,4]},
  {z:33, sym:'As', name:'砷',   shells:[2,8,18,5]},
  {z:34, sym:'Se', name:'硒',   shells:[2,8,18,6]},
  {z:35, sym:'Br', name:'溴',   shells:[2,8,18,7]},
  {z:36, sym:'Kr', name:'氪',   shells:[2,8,18,8]}
];

let currentElement = null;
let shellRadii = [];

function randomElement() {
  const idx = Math.floor(Math.random() * elements.length);
  currentElement = elements[idx];
  document.getElementById('element-name').textContent =
    currentElement.sym + ' ' + currentElement.name;
  document.getElementById('element-detail').textContent =
    '原子序：' + currentElement.z + '　電子排布：' + currentElement.shells.join(',');
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  drawShells();
  createElectronPool();
  resetElectrons();
}

function drawShells() {
  const stage = document.getElementById('stage');
  // 移除舊的電子層
  stage.querySelectorAll('.shell, .shell-label').forEach(el => el.remove());

  const numShells = currentElement.shells.length;
  const maxRadius = 220;
  const minRadius = 70;
  shellRadii = [];

  for (let i = 0; i < numShells; i++) {
    const radius = minRadius + (maxRadius - minRadius) * (i / Math.max(numShells - 1, 1));
    shellRadii.push(radius);

    const shell = document.createElement('div');
    shell.className = 'shell';
    shell.style.width = (radius * 2) + 'px';
    shell.style.height = (radius * 2) + 'px';
    shell.dataset.shellIndex = i;
    stage.appendChild(shell);

    const label = document.createElement('div');
    label.className = 'shell-label';
    label.textContent = '第' + (i + 1) + '層';
    label.style.top = '50%';
    label.style.left = '50%';
    label.style.transform = 'translate(' + (radius - 20) + 'px, -50%)';
    stage.appendChild(label);
  }
}

function createElectronPool() {
  const pool = document.getElementById('electron-pool');
  pool.innerHTML = '';
  const total = currentElement.z;
  for (let i = 0; i < total; i++) {
    const e = document.createElement('div');
    e.className = 'pool-electron';
    e.draggable = true;
    e.dataset.electronId = i;
    e.addEventListener('dragstart', dragStart);
    pool.appendChild(e);
  }
}

let draggedElectron = null;

function dragStart(e) {
  draggedElectron = e.target;
  e.dataTransfer.setData('text/plain', '');
}

// 讓電子層和原子核可以接收拖放
document.addEventListener('DOMContentLoaded', () => {
  const stage = document.getElementById('stage');
  stage.addEventListener('dragover', e => e.preventDefault());
  stage.addEventListener('drop', handleDrop);
});

function handleDrop(e) {
  e.preventDefault();
  if (!draggedElectron) return;

  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left - 250; // 相對中心
  const y = e.clientY - rect.top - 250;
  const dist = Math.sqrt(x * x + y * y);

  // 找出最近的電子層
  let closestShell = -1;
  let minDiff = Infinity;
  shellRadii.forEach((r, i) => {
    const diff = Math.abs(dist - r);
    if (diff < minDiff) { minDiff = diff; closestShell = i; }
  });

  if (closestShell === -1) return;

  // 將電子放到該層的圓周上
  const radius = shellRadii[closestShell];
  const angle = Math.atan2(y, x);
  const ex = 250 + radius * Math.cos(angle) - 9;
  const ey = 250 + radius * Math.sin(angle) - 9;

  draggedElectron.style.position = 'absolute';
  draggedElectron.style.left = ex + 'px';
  draggedElectron.style.top = ey + 'px';
  draggedElectron.dataset.shell = closestShell;
  stage.appendChild(draggedElectron);

  // 重新綁定拖拉
  draggedElectron.addEventListener('dragstart', dragStart);
  draggedElectron = null;
}

function resetElectrons() {
  if (!currentElement) return;
  const stage = document.getElementById('stage');
  stage.querySelectorAll('.electron').forEach(el => el.remove());
  createElectronPool();
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
}

function checkAnswer() {
  if (!currentElement) {
    document.getElementById('feedback').textContent = '請先抽出元素！';
    document.getElementById('feedback').className = 'wrong';
    return;
  }

  const stage = document.getElementById('stage');
  const placed = stage.querySelectorAll('.electron');
  const totalNeeded = currentElement.z;

  if (placed.length < totalNeeded) {
    document.getElementById('feedback').textContent =
      '還有 ' + (totalNeeded - placed.length) + ' 粒電子未放置！';
    document.getElementById('feedback').className = 'partial';
    return;
  }

  // 統計每層的電子數
  const counts = new Array(currentElement.shells.length).fill(0);
  placed.forEach(el => {
    const s = parseInt(el.dataset.shell);
    if (!isNaN(s)) counts[s]++;
  });

  const correct = currentElement.shells;
  let allCorrect = true;
  for (let i = 0; i < correct.length; i++) {
    if (counts[i] !== correct[i]) { allCorrect = false; break; }
  }

  if (allCorrect) {
    document.getElementById('feedback').textContent = '🎉 完全正確！';
    document.getElementById('feedback').className = 'correct';
  } else {
    document.getElementById('feedback').textContent =
      '❌ 未完全正確。你的排布：' + counts.join(',') +
      '　正確排布：' + correct.join(',');
    document.getElementById('feedback').className = 'wrong';
  }
}
</script>

</body>
</html>
